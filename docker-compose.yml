services:
  franchise-service:
    build: .
    container_name: franchise-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      ConnectionStrings__FranchiseDb: Host=franchise-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      franchise-db:
        condition: service_healthy
    networks:
      - microservices-net

  franchise-db:
    image: postgres:17-alpine
    container_name: franchise-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5438:5432"
    volumes:
      - franchise_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  microservices-net:
    external: true
volumes:
  franchise_data:
